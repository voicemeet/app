name: Weekly Build
on:
  schedule:
    - cron: "0 1 * * 6" # At 01:00 AM, only on Saturday, UTC
  # Enable manual run
  workflow_dispatch:

# Declare default permissions as readonly.
permissions:
  contents: write

env:
  repository: "voicemeet/voicemeet"
  main-path: "main"
  source-path: "voicemeet"

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-22.04
    outputs:
      flutter_channel: ${{ steps.flutter_version_step.outputs.flutter_channel }}
      flutter_version: ${{ steps.flutter_version_step.outputs.flutter_version }}
      sha: ${{ steps.sha_step.outputs.sha }}
      version: ${{ steps.version_step.outputs.version }}
      build_number: ${{ steps.version_step.outputs.build_number }}
      nightly_date: ${{ steps.version_step.outputs.nightly_date }}
      release: ${{ steps.version_step.outputs.release }}
      tag_name: ${{ steps.version_step.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ${{ env.main-path }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ${{ env.repository }}
          token: ${{ secrets.VM_RELEASE_TOKEN }}
          path: ${{ env.source-path }}

      - name: Set flutter version
        id: flutter_version_step
        run: |
          flutter_channel=$(sed -n -E "s/.*flutter-channel:\ '(.*)'/\1/p" .github/workflows/release.yml|head -n1)
          flutter_version=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml|head -n1)
          echo "flutter_channel: $flutter_channel, flutter_version: $flutter_version."

          echo "flutter_channel=$flutter_channel" >> $GITHUB_OUTPUT
          echo "flutter_version=$flutter_version" >> $GITHUB_OUTPUT
        working-directory: ${{ env.source-path }}

      - name: Set sha
        id: sha_step
        run: |
          SHA=$(git rev-parse HEAD)
          echo "SHA: $SHA."

          echo "sha=$SHA" >> $GITHUB_OUTPUT
        working-directory: ${{ env.main-path }}

      - name: Set sha from source
        id: sha_source_step
        run: |
          sha_source=$(git rev-parse HEAD)
          echo "sha_source: $sha_source."

          echo "sha_source=$sha_source" >> $GITHUB_OUTPUT
        working-directory: ${{ env.source-path }}

      - name: Set version
        id: version_step
        run: |
          VERSION=0.0.0
          echo "VERSION: $VERSION."

          BUILD_NUMBER=$(date '+%Y%m%d')
          echo "BUILD_NUMBER: $BUILD_NUMBER."

          NIGHTLY_DATE=$(date '+%Y.%m.%d')
          echo "NIGHTLY_DATE: $NIGHTLY_DATE"

          SUFFIX=weekly
          FULL_VERSION="$VERSION.$SUFFIX.$NIGHTLY_DATE"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "nightly_date=$NIGHTLY_DATE" >> $GITHUB_OUTPUT
          echo "release=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$FULL_VERSION" >> $GITHUB_OUTPUT

      - name: Create a release
        run: |
          RELEASE_NOTES="Release created by [releases](https://github.com/${{ github.repository }}) workflow run [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }})<br/><br/>Based on [voicemeet](https://github.com/${{ env.repository }}/commit/${{ steps.sha_source_step.outputs.sha_source }})<br/><br/>Please refer to [CHANGELOG.md](https://voicemeet.net/changelog) for details."
          gh release create "$TAG_NAME" --draft --latest=false --prerelease=false --target "$SHA" --title "Weekly build ${{ env.nightly_date }}" --notes "$RELEASE_NOTES"
        env:
          SHA: ${{ steps.sha_step.outputs.sha }}
          TAG_NAME: ${{ steps.version_step.outputs.tag_name }}
          nightly_date: ${{ steps.version_step.outputs.nightly_date }}
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ env.main-path }}

  publish:
    name: Publish
    runs-on: ubuntu-22.04
    needs:
      - create-release
      - apk
      - appbundle
      - ipa
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ${{ env.main-path }}

      - name: Publish a release
        run: |
          gh release edit "$TAG_NAME" --prerelease --draft=false --tag "$TAG_NAME" --target "$SHA"
        env:
          SHA: ${{ needs.create-release.outputs.sha }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ env.main-path }}

  apk:
    name: Create apk
    runs-on: ubuntu-22.04
    needs:
      - create-release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ${{ env.main-path }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ${{ env.repository }}
          token: ${{ secrets.VM_RELEASE_TOKEN }}
          path: ${{ env.source-path }}

      - uses: actions/setup-java@v6
        with:
          java-version: "17.x"
          distribution: "temurin"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ needs.create-release.outputs.flutter_channel }}
          flutter-version: ${{ needs.create-release.outputs.flutter_version }}

      - name: Flutter doctor -v
        run: flutter doctor -v

      - name: Configure .env
        run: echo "$ENV_STG_BASE64" | base64 --decode > .env
        env:
          ENV_STG_BASE64: ${{ secrets.ENV_STG_BASE64 }}
        working-directory: ${{ env.source-path }}

      - name: Install Deps
        run: flutter pub get
        working-directory: ${{ env.source-path }}

      - name: Configure Keystore for Android
        run: |
          echo "$PLAY_STORE_UPLOAD_KEY" | base64 --decode > app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" >> key.properties
          echo "keyAlias=$KEYSTORE_KEY_ALIAS" >> key.properties
          echo "keyPassword=$KEYSTORE_KEY_PASSWORD" >> key.properties
          echo "storePassword=$KEYSTORE_STORE_PASSWORD" >> key.properties
        env:
          PLAY_STORE_UPLOAD_KEY: ${{ secrets.PLAY_STORE_UPLOAD_KEY }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        working-directory: ${{ env.source-path }}/android

      # Build the application.
      - name: Build apk
        run: flutter build apk --dart-define-from-file=.env --no-tree-shake-icons --flavor staging --build-name=$VERSION --build-number $BUILD_NUMBER --obfuscate --split-debug-info=./symbols-directory-apk
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          BUILD_NUMBER: ${{ needs.create-release.outputs.build_number }}
        working-directory: ${{ env.source-path }}

      # Package the build.
      - name: Copy build for Android
        run: |
          mkdir -p $GITHUB_WORKSPACE/${{ env.main-path }}/apk
          cp app-staging-release.apk $GITHUB_WORKSPACE/${{ env.main-path }}/apk/VoiceMeet-$RELEASE.apk
        working-directory: ${{ env.source-path }}/build/app/outputs/flutter-apk
        env:
          RELEASE: ${{ needs.create-release.outputs.release }}

      - name: Upload assets
        if: ${{ secrets.R2_ACCOUNT_ID && secrets.R2_ACCESS_KEY_ID && secrets.R2_SECRET_ACCESS_KEY && secrets.R2_RELEASE_BUCKET }}
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_RELEASE_BUCKET }}
          source-dir: ./${{ env.main-path }}/apk
          destination-dir: ./${{ needs.create-release.outputs.tag_name }}/

      - name: Upload symbols
        if: ${{ secrets.R2_ACCOUNT_ID && secrets.R2_ACCESS_KEY_ID && secrets.R2_SECRET_ACCESS_KEY && secrets.R2_BUCKET }}
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: ./${{ env.source-path }}/symbols-directory-apk
          destination-dir: ./${{ needs.create-release.outputs.tag_name }}/apk

      - name: Clean up
        if: ${{ always() }}
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/key.properties
          rm -f .env
        working-directory: ${{ env.source-path }}

  appbundle:
    name: Create appbundle
    runs-on: ubuntu-22.04
    needs:
      - create-release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ${{ env.main-path }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ${{ env.repository }}
          token: ${{ secrets.VM_RELEASE_TOKEN }}
          path: ${{ env.source-path }}

      - uses: actions/setup-java@v6
        with:
          java-version: "17.x"
          distribution: "temurin"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ needs.create-release.outputs.flutter_channel }}
          flutter-version: ${{ needs.create-release.outputs.flutter_version }}

      - name: Flutter doctor -v
        run: flutter doctor -v

      - name: Configure .env
        run: echo "$ENV_STG_BASE64" | base64 --decode > .env
        env:
          ENV_STG_BASE64: ${{ secrets.ENV_STG_BASE64 }}
        working-directory: ${{ env.source-path }}

      - name: Install Deps
        run: flutter pub get
        working-directory: ${{ env.source-path }}

      - name: Configure Keystore for Android
        run: |
          echo "$PLAY_STORE_UPLOAD_KEY" | base64 --decode > app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" >> key.properties
          echo "keyAlias=$KEYSTORE_KEY_ALIAS" >> key.properties
          echo "keyPassword=$KEYSTORE_KEY_PASSWORD" >> key.properties
          echo "storePassword=$KEYSTORE_STORE_PASSWORD" >> key.properties
        env:
          PLAY_STORE_UPLOAD_KEY: ${{ secrets.PLAY_STORE_UPLOAD_KEY }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        working-directory: ${{ env.source-path }}/android

      # Build the application.
      - name: Build appbundle
        run: |
          # https://docs.flutter.dev/release/breaking-changes/default-abi-filters-android#option-3-disable-flutters-default-abi-filtering
          flutter build appbundle --dart-define-from-file=.env --no-tree-shake-icons --flavor staging --build-name=$VERSION --build-number $BUILD_NUMBER --obfuscate --split-debug-info=./symbols-directory-appbundle -Pdisable-abi-filtering=true
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          BUILD_NUMBER: ${{ needs.create-release.outputs.build_number }}
        working-directory: ${{ env.source-path }}

      # Package the build.
      - name: Copy build for Android
        run: |
          mkdir -p $GITHUB_WORKSPACE/${{ env.main-path }}/appbundle
          cp *.aab $GITHUB_WORKSPACE/${{ env.main-path }}/appbundle/VoiceMeet-$RELEASE.aab
        working-directory: ${{ env.source-path }}/build/app/outputs/bundle/stagingRelease
        env:
          RELEASE: ${{ needs.create-release.outputs.release }}

      - name: Upload assets
        if: ${{ secrets.R2_ACCOUNT_ID && secrets.R2_ACCESS_KEY_ID && secrets.R2_SECRET_ACCESS_KEY && secrets.R2_RELEASE_BUCKET }}
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_RELEASE_BUCKET }}
          source-dir: ./${{ env.main-path }}/appbundle
          destination-dir: ./${{ needs.create-release.outputs.tag_name }}/

      - name: Upload symbols
        if: ${{ secrets.R2_ACCOUNT_ID && secrets.R2_ACCESS_KEY_ID && secrets.R2_SECRET_ACCESS_KEY && secrets.R2_BUCKET }}
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: ./${{ env.source-path }}/symbols-directory-appbundle
          destination-dir: ./${{ needs.create-release.outputs.tag_name }}/appbundle

      - name: Clean up
        if: ${{ always() }}
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/key.properties
          rm -f .env
        working-directory: ${{ env.source-path }}

  ipa:
    name: Create ipa
    runs-on: macos-26
    needs:
      - create-release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ${{ env.main-path }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ${{ env.repository }}
          token: ${{ secrets.VM_RELEASE_TOKEN }}
          path: ${{ env.source-path }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ needs.create-release.outputs.flutter_channel }}
          flutter-version: ${{ needs.create-release.outputs.flutter_version }}

      - name: Flutter doctor -v
        run: flutter doctor -v

      - name: Configure .env
        run: echo "$ENV_STG_BASE64" | base64 --decode > .env
        env:
          ENV_STG_BASE64: ${{ secrets.ENV_STG_BASE64 }}
        working-directory: ${{ env.source-path }}

      - name: Resolving flutter dependencies
        run: flutter pub get
        working-directory: ${{ env.source-path }}

      - name: Install the Apple certificate and provisioning profile
        env:
          P12_DEV_BASE64: ${{ secrets.P12_DEV_BASE64 }}
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_DEV_BASE64: ${{ secrets.PROVISION_PROFILE_DEV_BASE64 }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_DEV_PATH=$RUNNER_TEMP/build_certificate_dev.p12
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_DEV_PATH=$RUNNER_TEMP/voicemeet_dev.mobileprovision
          PP_PATH=$RUNNER_TEMP/voicemeet_appstore.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/kty-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$P12_DEV_BASE64" | base64 --decode --output $CERTIFICATE_DEV_PATH
          echo -n "$P12_BASE64" | base64 --decode --output $CERTIFICATE_PATH
          echo -n "$PROVISION_PROFILE_DEV_BASE64" | base64 --decode --output $PP_DEV_PATH
          echo -n "$PROVISION_PROFILE_BASE64" | base64 --decode --output $PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_DEV_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          mv $PP_DEV_PATH ~/Library/MobileDevice/Provisioning\ Profiles
          mv $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build ipa
        run: flutter build ipa --dart-define-from-file=.env --build-name=$VERSION --build-number $BUILD_NUMBER --obfuscate --split-debug-info=./symbols-directory-ipa --export-options-plist=ios/ExportOptions/debug.plist
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          BUILD_NUMBER: ${{ needs.create-release.outputs.build_number }}
        working-directory: ${{ env.source-path }}

      # Package the build.
      - name: Copy build for iOS
        run: |
          mkdir -p $GITHUB_WORKSPACE/${{ env.main-path }}/ipa
          cp *.ipa $GITHUB_WORKSPACE/${{ env.main-path }}/ipa/VoiceMeet-$RELEASE.ipa
        working-directory: ${{ env.source-path }}/build/ios/ipa
        env:
          RELEASE: ${{ needs.create-release.outputs.release }}

      - name: Upload assets
        if: ${{ secrets.R2_ACCOUNT_ID && secrets.R2_ACCESS_KEY_ID && secrets.R2_SECRET_ACCESS_KEY && secrets.R2_RELEASE_BUCKET }}
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_RELEASE_BUCKET }}
          source-dir: ./${{ env.main-path }}/ipa
          destination-dir: ./${{ needs.create-release.outputs.tag_name }}/

      - name: Upload symbols
        if: ${{ secrets.R2_ACCOUNT_ID && secrets.R2_ACCESS_KEY_ID && secrets.R2_SECRET_ACCESS_KEY && secrets.R2_BUCKET }}
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: ./${{ env.source-path }}/symbols-directory-ipa
          destination-dir: ./${{ needs.create-release.outputs.tag_name }}/ipa

      - name: Clean up
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/kty-signing.keychain-db" ]; then
            echo "$RUNNER_TEMP/kty-signing.keychain-db"
            security delete-keychain $RUNNER_TEMP/kty-signing.keychain-db
          fi
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/voicemeet_*.mobileprovision
          rm -f .env
        working-directory: ${{ env.source-path }}

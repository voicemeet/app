name: Code Quality (Desktop)
run-name: ${{ github.event.client_payload.commit_message }}

on:
  repository_dispatch:
    types: [ desktop-push, desktop-pull_request ]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 工作空间：本仓库 → main/，desktop 源码仓库 → desktop/（详见文件顶部「工作空间」说明）
  repository: 'voicemeet/voicemeet-desktop'
  main-path: 'main'
  source-path: 'desktop'

jobs:
  # ── 代码规范：ESLint + Prettier + TypeScript ──────────────────────
  lint:
    name: Lint / Format / Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: ${{ env.main-path }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ${{ env.repository }}
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.VM_APP_TOKEN }}
          path: ${{ env.source-path }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.source-path }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.source-path }}

      - name: ESLint
        run: npm run lint
        working-directory: ${{ env.source-path }}

      - name: Prettier
        run: npm run format:check
        working-directory: ${{ env.source-path }}

      - name: Typecheck
        run: npm run typecheck
        working-directory: ${{ env.source-path }}
